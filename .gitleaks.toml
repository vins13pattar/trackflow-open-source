[extend]
useDefault = true

# RFC 6238 Appendix B publishes this Base32 test vector. It is deliberately
# committed in the TOTP conformance test and is not an application credential.
# Pin the exception to generic-api-key so other secret rules continue scanning
# this file. Gitleaks 8.24 evaluates global allow-list paths before values,
# which would otherwise suppress every finding in the conformance test.
[[rules]]
id = "generic-api-key"

  [[rules.allowlists]]
  description = "RFC 6238 published TOTP test vector"
  condition = "AND"
  paths = ['''(^|/)packages/shared/src/totp\.test\.ts$''']
  regexes = ['''^GEZDGNBVGY3TQOJQGEZDGNBVGY3TQOJQ$''']
