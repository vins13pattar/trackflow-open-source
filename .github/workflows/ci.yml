name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_USER: trackflow
          POSTGRES_PASSWORD: trackflow
          POSTGRES_DB: trackflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trackflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      ADMIN_DATABASE_URL: postgres://trackflow:trackflow@localhost:5432/trackflow
      DATABASE_URL: postgres://trackflow_app:trackflow_app@localhost:5432/trackflow
      SYSTEM_DATABASE_URL: postgres://trackflow_system:trackflow_system@localhost:5432/trackflow
      TF_DB_TESTS: '1'
      TF_REDIS_TESTS: '1'
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm --filter @trackflow/db db:migrate
      - run: pnpm --filter @trackflow/db db:rls
      - run: pnpm test
      - run: pnpm build
      - name: Validate Prometheus rules
        run: >-
          docker run --rm --entrypoint /bin/promtool
          -v "$PWD/ops/prometheus:/rules:ro"
          prom/prometheus@sha256:6927e0919a144aa7616fd0137d4816816d42f6b816de3af269ab065250859a62
          check rules /rules/alerts.yml
      # Load-test gates: boot one API process and fail on either the internal
      # ingest write budget or authenticated tenant read/write budgets.
      - name: Load-test gates (ingest and authenticated API p95)
        run: |
          pnpm --filter @trackflow/api start &
          API_PID=$!
          for _ in $(seq 1 30); do curl -sf http://127.0.0.1:8787/health >/dev/null && break; sleep 1; done
          set +e
          P95_BUDGET_MS=1000 N=1000 CONCURRENCY=50 node loadtest/run.mjs
          INGEST_STATUS=$?
          READ_P95_BUDGET_MS=300 WRITE_P95_BUDGET_MS=300 MAX_ERROR_RATE=0 \
            READ_N=200 WRITE_N=100 CONCURRENCY=20 \
            OUTPUT=benchmarks/results/ci-api.json \
            node loadtest/authenticated-api.mjs
          API_STATUS=$?
          set -e
          kill "$API_PID" 2>/dev/null || true
          if [ "$INGEST_STATUS" -ne 0 ] || [ "$API_STATUS" -ne 0 ]; then exit 1; fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: authenticated-api-benchmark
          path: benchmarks/results/ci-api.json
          retention-days: 30

  mobile-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      # Mobile is excluded from the pnpm workspace (native module hoisting
      # conflicts), so we install it standalone with npm inside its directory.
      - run: npm ci --legacy-peer-deps
      - run: npm test
