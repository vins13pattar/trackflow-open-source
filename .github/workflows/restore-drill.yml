name: Restore drill

# Disaster-recovery drill (PRD §6.2: RPO ≤ 5 min, RTO ≤ 60 min). Runs monthly
# and on demand. The scratch-DB job always runs and keeps the drill mechanics +
# verifier honest; the Neon PITR job runs only when Neon secrets are configured.
on:
  schedule:
    - cron: '0 6 1 * *' # 06:00 UTC on the 1st of each month
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Proves the verifier passes against a freshly-migrated database — so schema
  # drift or a verifier bug is caught continuously, not during a real incident.
  verify-scratch:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_USER: trackflow
          POSTGRES_PASSWORD: trackflow
          POSTGRES_DB: trackflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trackflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      ADMIN_DATABASE_URL: postgres://trackflow:trackflow@localhost:5432/trackflow
      DATABASE_URL: postgres://trackflow_app:trackflow_app@localhost:5432/trackflow
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @trackflow/db db:migrate
      - run: pnpm --filter @trackflow/db db:rls
      - name: Verify restore coherence
        run: pnpm --filter @trackflow/db db:verify-restore

  # Real Point-In-Time restore against Neon, then verify the scratch branch.
  # Skipped automatically unless NEON_API_KEY + NEON_PROJECT_ID are configured.
  verify-neon-pitr:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check Neon secrets
        id: gate
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
        run: |
          if [ -z "$NEON_API_KEY" ] || [ -z "$NEON_PROJECT_ID" ]; then
            echo "Neon secrets not configured — skipping the live PITR drill."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        if: steps.gate.outputs.run == 'true'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: 22
          cache: pnpm
      - name: Create a PITR scratch branch (5 minutes ago) and verify
        if: steps.gate.outputs.run == 'true'
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
        run: |
          set -euo pipefail
          npm i -g neonctl
          TS="$(date -u -d '5 minutes ago' +%Y-%m-%dT%H:%M:%SZ)"
          BRANCH="restore-drill-$(date -u +%Y%m%d%H%M%S)"
          echo "Restoring to $TS on branch $BRANCH"
          neonctl branches create --project-id "$NEON_PROJECT_ID" --name "$BRANCH" --timestamp "$TS"
          SCRATCH_URL="$(neonctl connection-string "$BRANCH" --project-id "$NEON_PROJECT_ID" --role-name trackflow)"
          pnpm install --frozen-lockfile
          ADMIN_DATABASE_URL="$SCRATCH_URL" pnpm --filter @trackflow/db db:verify-restore
          # Clean up the scratch branch regardless of outcome.
          neonctl branches delete "$BRANCH" --project-id "$NEON_PROJECT_ID" || true
