name: Benchmark regression

on:
  pull_request:
    paths:
      - 'apps/ingest/**'
      - 'packages/protocols/**'
      - 'benchmarks/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/benchmark.yml'
  schedule:
    - cron: '41 2 * * *'
  workflow_dispatch:
    inputs:
      devices:
        description: Synthetic device count (10,000 is a manual release gate)
        required: true
        default: '1000'
        type: choice
        options: ['1000', '10000']

permissions:
  contents: read

jobs:
  tcp-ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Select tier
        id: tier
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_DEVICES: ${{ inputs.devices }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo "devices=100" >> "$GITHUB_OUTPUT"
            echo "duration=8" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = "schedule" ]; then
            echo "devices=1000" >> "$GITHUB_OUTPUT"
            echo "duration=30" >> "$GITHUB_OUTPUT"
          else
            echo "devices=$INPUT_DEVICES" >> "$GITHUB_OUTPUT"
            if [ "$INPUT_DEVICES" = "10000" ]; then
              echo "duration=60" >> "$GITHUB_OUTPUT"
            else
              echo "duration=30" >> "$GITHUB_OUTPUT"
            fi
          fi
      - name: Run mixed-protocol TCP benchmark
        run: >-
          pnpm benchmark:tcp:local --
          --devices=${{ steps.tier.outputs.devices }}
          --duration=${{ steps.tier.outputs.duration }}
          --interval=1000
          --connection-rate=500
          --seed=42
          --output=benchmarks/results/ci-tcp.json
      - name: Enforce deterministic regression budget
        run: node benchmarks/check-result.mjs benchmarks/results/ci-tcp.json ${{ steps.tier.outputs.devices }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tcp-benchmark-${{ steps.tier.outputs.devices }}
          path: benchmarks/results/ci-tcp.json
          retention-days: 30
