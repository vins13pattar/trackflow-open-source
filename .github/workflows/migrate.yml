name: DB migrate + RLS

# One-click, manual-only runner for the single imperative setup step that
# dashboard env vars don't cover: applying migrations and provisioning the
# non-superuser app role + RLS policies against a real (e.g. Neon) database.
#
# Configure these repository secrets first (Settings → Secrets and variables →
# Actions):
#   ADMIN_DATABASE_URL  - the Neon OWNER role URL (runs migrations + RLS setup)
#   APP_DB_PASSWORD     - password to set for the runtime app role
#   DATABASE_URL        - (optional) the non-superuser app-role URL; if set, the
#                         RLS isolation test runs to PROVE tenant isolation.
# Optional variable:
#   APP_DB_ROLE         - runtime role name (defaults to trackflow_app)
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "migrate" to confirm running against the configured database'
        required: true
        default: ''

permissions:
  contents: read

jobs:
  migrate:
    if: ${{ github.event.inputs.confirm == 'migrate' }}
    runs-on: ubuntu-latest
    env:
      ADMIN_DATABASE_URL: ${{ secrets.ADMIN_DATABASE_URL }}
      APP_DB_PASSWORD: ${{ secrets.APP_DB_PASSWORD }}
      APP_DB_ROLE: ${{ vars.APP_DB_ROLE || 'trackflow_app' }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Guard against an unset database URL
        run: |
          if [ -z "$ADMIN_DATABASE_URL" ]; then
            echo "::error::ADMIN_DATABASE_URL secret is not set."; exit 1
          fi

      - name: Apply migrations
        run: pnpm --filter @trackflow/db db:migrate

      - name: Provision app role + RLS policies
        run: pnpm --filter @trackflow/db db:rls

      - name: Verify restore coherence (migrations/RLS/partitioning)
        run: pnpm --filter @trackflow/db db:verify-restore

      - name: Prove tenant isolation (only if the app-role URL is provided)
        if: ${{ env.DATABASE_URL != '' }}
        env:
          TF_DB_TESTS: '1'
        run: pnpm --filter @trackflow/db test
