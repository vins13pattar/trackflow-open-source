# Example Prometheus scrape config for the three TrackFlow runtime processes.
# Each exposes /metrics gated on METRICS_TOKEN (see .env.example) — set the same
# token here as the bearer credential. Adjust targets to your deployment.
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: trackflow-api
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials: ${METRICS_TOKEN}
    static_configs:
      - targets: ['api.internal:8787']

  - job_name: trackflow-ingest
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials: ${METRICS_TOKEN}
    static_configs:
      - targets: ['ingest.internal:9100']

  - job_name: trackflow-jobs
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials: ${METRICS_TOKEN}
    static_configs:
      - targets: ['jobs.internal:9101']
