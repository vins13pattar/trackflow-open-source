# TrackFlow API on Fly.io. Production keeps two small replicas warm; synthetic
# staging can use a separate override that scales to zero.
# Lives at the repo root so the build context is the pnpm workspace root.
# Deploy:  fly deploy --config fly.api.toml
app = "trackflow-api"
primary_region = "sin" # Singapore — common region with ingest, Neon and Upstash

[build]
  dockerfile = "apps/api/Dockerfile"

[env]
  NODE_ENV = "production"
  API_PORT = "8787"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 2

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
